name: Terraform fmt & validate

on:
  push:
    paths:
      - "**/*.tf"
      - ".tflint.hcl"
      - ".github/workflows/terraform-check.yml"
  pull_request:
    paths:
      - "**/*.tf"
      - ".tflint.hcl"
      - ".github/workflows/terraform-check.yml"

jobs:
  check-root:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt (check only, no rewrite)
        run: terraform fmt -check -recursive

      - name: terraform init (backend-less, just to resolve providers/modules)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  # validate proves the HCL parses; tflint catches what it lets through (unused
  # variables, undocumented inputs/outputs, deprecated syntax, invalid AWS values).
  # Config lives in .tflint.hcl at the repo root.
  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.65.0

      # --recursive looks for .tflint.hcl inside each module directory, so the
      # root config has to be passed explicitly (absolute path) or it is silently
      # ignored and only tflint's built-in defaults run.
      - name: tflint --init (download the AWS ruleset)
        run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: tflint (every module)
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  # The root module above only wires in capacity/ecr/ecs-service/loadbalancer/
  # secrets/security, so `terraform validate` there never touches the other,
  # standalone modules (vpc, iam, eks, route53, cloudfront, sqs, sns, s3,
  # lambda, app-runner, elasticache, ssm-access) - they'd never get validated at all otherwise. This
  # job validates every module under aws/Modules/ independently.
  check-modules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - vpc
          - iam
          - eks
          - route53
          - cloudfront
          - sqs
          - sns
          - s3
          - lambda
          - app-runner
          - elasticache
          - ssm-access
          - capacity
          - ecr
          - ecs-service
          - loadbalancer
          - secrets
          - security
    defaults:
      run:
        working-directory: aws/Modules/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform init (backend-less, just to resolve providers)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate
