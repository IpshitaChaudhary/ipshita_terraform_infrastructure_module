name: Terraform fmt & validate

on:
  push:
    paths:
      - "**/*.tf"
      - ".tflint.hcl"
      - ".checkov.yaml"
      - ".github/workflows/terraform-check.yml"
  # Every PR runs the checks, even docs-only ones: main is protected and
  # requires the ci-passed job below, so a PR that skipped the workflow could
  # never be merged.
  pull_request:

jobs:
  check-root:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt (check only, no rewrite)
        run: terraform fmt -check -recursive

      - name: terraform init (backend-less, just to resolve providers/modules)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  # validate proves the HCL parses; tflint catches what it lets through (unused
  # variables, undocumented inputs/outputs, deprecated syntax, invalid AWS values).
  # Config lives in .tflint.hcl at the repo root.
  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.65.0

      # --recursive looks for .tflint.hcl inside each module directory, so the
      # root config has to be passed explicitly (absolute path) or it is silently
      # ignored and only tflint's built-in defaults run.
      - name: tflint --init (download the AWS ruleset)
        run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: tflint (every module)
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  # Security/misconfiguration scan. Fails on any finding not explicitly accepted
  # (with a reason) in .checkov.yaml.
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install checkov==3.4.0

      - name: checkov (all modules)
        run: checkov -d aws --config-file .checkov.yaml

  # The root module above only wires in capacity/ecr/ecs-service/loadbalancer/
  # secrets/security, so `terraform validate` there never touches the other,
  # standalone modules (vpc, iam, eks, route53, cloudfront, sqs, sns, s3,
  # lambda, app-runner, elasticache, ssm-access) - they'd never get validated at all otherwise. This
  # job validates every module under aws/Modules/ independently.
  check-modules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - vpc
          - iam
          - eks
          - route53
          - cloudfront
          - sqs
          - sns
          - s3
          - lambda
          - app-runner
          - elasticache
          - ssm-access
          - capacity
          - ecr
          - ecs-service
          - loadbalancer
          - secrets
          - security
    defaults:
      run:
        working-directory: aws/Modules/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform init (backend-less, just to resolve providers)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  # Single required status check for branch protection on main. Waits for every
  # job above (including each module in the matrix) and fails if any of them
  # didn't succeed, so protection doesn't need updating when a module is added.
  ci-passed:
    if: always()
    needs: [check-root, check-modules, tflint, checkov]
    runs-on: ubuntu-latest
    steps:
      - name: All checks succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
